# ---------------------------------------------------------------
#  TIER 3: MySQL
#  StatefulSet (not Deployment) because a database needs:
#   - a stable name (mysql-0)
#   - its OWN persistent disk that survives pod restarts
#  AKS creates an Azure Managed Disk automatically for the PVC.
# ---------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: primeclone
  labels: { app: mysql }
spec:
  clusterIP: None            # headless: only reachable INSIDE the cluster
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: primeclone
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: __ACR_LOGIN_SERVER__/primeclone-mysql:__IMAGE_TAG__
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom: { configMapKeyRef: { name: primeclone-config, key: DB_NAME } }
            - name: MYSQL_USER
              valueFrom: { configMapKeyRef: { name: primeclone-config, key: DB_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: primeclone-secrets, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: primeclone-secrets, key: MYSQL_ROOT_PASSWORD } }
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3306 }
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi   # AKS default Azure Disk class
        resources:
          requests:
            storage: 5Gi
