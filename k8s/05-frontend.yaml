# ---------------------------------------------------------------
#  TIER 1: Frontend (nginx)
#  Service type LoadBalancer -> Azure creates a PUBLIC IP.
#  This is the ONLY thing exposed to the internet.
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: primeclone
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: __ACR_LOGIN_SERVER__/primeclone-frontend:__IMAGE_TAG__
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              valueFrom: { configMapKeyRef: { name: primeclone-config, key: BACKEND_HOST } }
            - name: BACKEND_PORT
              valueFrom: { configMapKeyRef: { name: primeclone-config, key: BACKEND_PORT } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: primeclone
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
