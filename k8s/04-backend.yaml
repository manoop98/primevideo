# ---------------------------------------------------------------
#  TIER 2: Backend API
#  2 replicas -> the Service load-balances between them.
#  (Refresh the website and watch "served by pod ..." change.)
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: primeclone
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: __ACR_LOGIN_SERVER__/primeclone-backend:__IMAGE_TAG__
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: primeclone-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: primeclone-secrets, key: MYSQL_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: primeclone-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/ready, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: primeclone
spec:
  type: ClusterIP             # internal only - the browser never calls this directly
  selector: { app: backend }
  ports:
    - port: 5000
      targetPort: 5000
