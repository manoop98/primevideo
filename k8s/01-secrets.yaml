# ---------------------------------------------------------------
#  Secret: passwords used by MySQL and the backend.
#  The pipeline replaces __TOKENS__ with SECRET pipeline variables,
#  so real passwords never live in Git.
# ---------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: primeclone-secrets
  namespace: primeclone
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "__MYSQL_ROOT_PASSWORD__"
  MYSQL_PASSWORD: "__MYSQL_PASSWORD__"
  JWT_SECRET: "__JWT_SECRET__"
